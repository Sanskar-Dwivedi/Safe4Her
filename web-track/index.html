<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Security4Her · Live location</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <style>
    :root {
      --purple: #5B2A86; --purple-soft: #efe7f7; --coral: #FF6F61; --red: #C62828; --green: #2E7D32;
      --ink: #1d1b20; --muted: #5f5b66; --bg: #ffffff; --card: #f7f5fa; --line: #e3dfe8;
    }
    @media (prefers-color-scheme: dark) {
      :root { --ink: #f3eff7; --muted: #b8b1c2; --bg: #141218; --card: #1f1c24; --line: #34303b; --purple-soft: #2c2238; }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink);
      font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--purple); color: #fff; }
    header svg { flex: none; }
    header b { font-size: 17px; letter-spacing: .2px; }
    main { max-width: 720px; margin: 0 auto; padding: 16px; }
    .status { border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; background: var(--card); border: 1px solid var(--line); }
    .status h1 { margin: 0 0 4px; font-size: 20px; }
    .status p { margin: 0; color: var(--muted); }
    .status.active { border-color: var(--red); background: color-mix(in srgb, var(--red) 8%, var(--card)); }
    .status.active h1 { color: var(--red); }
    .status.ended h1 { color: var(--green); }
    .pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--red); color: #fff; vertical-align: middle; margin-left: 6px; }
    #map { height: 55vh; min-height: 280px; border-radius: 14px; border: 1px solid var(--line); overflow: hidden; }
    .meta { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; color: var(--muted); font-size: 14px; margin: 8px 2px 12px; }
    .warn { color: #b26a00; font-weight: 600; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn { display: flex; align-items: center; justify-content: center; min-height: 48px; border-radius: 12px; font-weight: 700;
      text-decoration: none; color: #fff; background: var(--purple); padding: 10px; text-align: center; }
    .btn.call { background: var(--red); }
    .note { color: var(--muted); font-size: 13px; margin-top: 16px; }
    .hidden { display: none !important; }
    #coords { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <header>
    <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M12 2 4 5v6c0 5.25 3.4 10.15 8 11.35C16.6 21.15 20 16.25 20 11V5l-8-3z"/><path fill="#FF6F61" d="m12 16.5-.9-.82C8 12.9 6 11.1 6 8.9 6 7.1 7.4 5.7 9.2 5.7c1 0 2 .47 2.8 1.2.8-.73 1.8-1.2 2.8-1.2 1.8 0 3.2 1.4 3.2 3.2 0 2.2-2 4-5.1 6.78l-.9.82z"/></svg>
    <b>Security4Her</b>
  </header>
  <main>
    <section id="status" class="status" aria-live="polite">
      <h1 id="title">Loading…</h1>
      <p id="subtitle">Fetching the latest location.</p>
    </section>

    <section id="live" class="hidden">
      <div id="map" role="img" aria-label="Map showing her latest location"></div>
      <div class="meta">
        <span id="updated"></span>
        <span id="coords"></span>
      </div>
      <div class="actions">
        <a id="navigate" class="btn" target="_blank" rel="noopener">Navigate to her</a>
        <a class="btn call" href="tel:112">Call 112</a>
      </div>
    </section>

    <p class="note">This page updates every 10 seconds and stops showing a location as soon as she marks herself safe.
      If you can't reach her, call 112. Don't forward this link.</p>
  </main>

  <script src="config.js"></script>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
