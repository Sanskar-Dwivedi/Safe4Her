<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1000" viewBox="0 0 1560 1000">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#526a63"/></marker><style>text{font-family:Arial,sans-serif;fill:#17362f}.title{font-size:31px;font-weight:bold}.head{font-size:20px;font-weight:bold}.body{font-size:16px}.tiny{font-size:14px;fill:#4c645e}.box{fill:#fff;stroke:#7c9c91;stroke-width:2}.wire{fill:none;stroke:#526a63;stroke-width:2.5;marker-end:url(#arrow)}</style></defs>
<rect width="1560" height="1000" fill="#f2f4ee"/>
<text x="55" y="65" class="title">Security4Her / button ring circuit architecture</text><text x="55" y="98" class="body">Functional connections only · no pin-level schematic or routed PCB · R1 / 2 October 2026</text>
<rect x="55" y="150" width="240" height="170" rx="10" class="box"/><text x="75" y="183" class="head">USB-C keyed dock</text><text x="75" y="214" class="body">5 V input + CC resistors</text><text x="75" y="240" class="body">Current / contact protection</text><text x="75" y="266" class="body">ESD + two pogo contacts</text><text x="75" y="299" class="tiny">Ring pads: 5 V and ground</text>
<rect x="375" y="150" width="290" height="170" rx="10" class="box"/><text x="395" y="183" class="head">BQ25101 charger</text><text x="395" y="214" class="body">IN ← protected dock supply</text><text x="395" y="240" class="body">OUT → PACK+ / system rail</text><text x="395" y="266" class="body">4.2 V CV / nominal 10 mA</text><text x="395" y="299" class="tiny">ISET: 13.5 kΩ; input/output caps</text>
<path d="M295 235H375" class="wire"/>
<rect x="755" y="150" width="295" height="170" rx="10" class="box"/><text x="775" y="183" class="head">Protected battery pack</text><text x="775" y="214" class="body">18.5 mAh curved LiPo</text><text x="775" y="240" class="body">1S protection IC + dual FET</text><text x="775" y="266" class="body">Charge/discharge/short cutoff</text><text x="775" y="299" class="tiny">Exact protection parts: TBD</text>
<path d="M665 235H755" class="wire"/><text x="680" y="220" class="tiny">PACK+</text>
<rect x="1130" y="150" width="365" height="170" rx="10" class="box"/><text x="1150" y="183" class="head">TPS7A0230PDQNR</text><text x="1150" y="214" class="body">PACK+ → regulated 3.0 V</text><text x="1150" y="240" class="body">Low quiescent-current LDO</text><text x="1150" y="266" class="body">Input/output decoupling</text><text x="1150" y="299" class="tiny">No direct 4.2 V supply to MCU</text>
<path d="M1050 235H1130" class="wire"/>
<rect x="375" y="390" width="290" height="120" rx="10" class="box"/><text x="395" y="427" class="head">Cell temperature NTC</text><text x="395" y="457" class="body">10 kΩ / approved curve</text><text x="395" y="487" class="tiny">Thermally coupled to the cell</text><path d="M520 390V320" class="wire"/><text x="534" y="360" class="tiny">TS</text>
<rect x="55" y="560" width="280" height="160" rx="10" class="box"/><text x="75" y="596" class="head">Recessed tactile button</text><text x="75" y="628" class="body">SKTAAAE010</text><text x="75" y="656" class="body">GPIO + pull-up; press to GND</text><text x="75" y="691" class="tiny">Debounce + 1.5-second hold</text>
<rect x="450" y="560" width="445" height="210" rx="10" class="box"/><text x="475" y="597" class="head">nRF52832-CIAA-G-R7</text><text x="475" y="630" class="body">BLE peripheral + event state machine</text><text x="475" y="660" class="body">32 MHz / 32.768 kHz clocks + decoupling</text><text x="475" y="690" class="body">Bonding, authentication, retries, watchdog</text><text x="475" y="720" class="body">SWD programming pads / battery ADC divider</text><text x="475" y="748" class="tiny">3.0 V supply; optional LED + resistor</text>
<path d="M335 640H450" class="wire"/><path d="M1310 320V365H850V560" class="wire"/><text x="1090" y="353" class="tiny">3.0 V logic rail</text>
<path d="M905 320V455H725V560" class="wire"/><text x="925" y="432" class="tiny">PACK+ → switched divider → ADC</text>
<path d="M605 320V354H690V560" class="wire"/><text x="696" y="532" class="tiny">CHG status, pull-up to 3 V</text>
<rect x="985" y="560" width="235" height="155" rx="10" class="box"/><text x="1005" y="597" class="head">RF matching</text><text x="1005" y="632" class="body">2.4 GHz antenna</text><text x="1005" y="660" class="body">Polymer RF window</text><text x="1005" y="690" class="tiny">Tune in final enclosure</text><path d="M895 638H985" class="wire"/>
<rect x="1300" y="560" width="195" height="155" rx="10" class="box"/><text x="1320" y="597" class="head">Phone app</text><text x="1320" y="632" class="body">Authenticated event</text><text x="1320" y="660" class="body">SOS + app ACK</text><text x="1320" y="690" class="tiny">Delivery status separate</text><path d="M1220 638H1300" class="wire" marker-start="url(#arrow)"/>
<text x="55" y="843" class="head">Ground and battery protection</text><text x="55" y="874" class="body">Charger VSS, LDO ground and MCU ground connect to PACK−. Raw cell B− stays behind the protection FETs.</text><text x="55" y="903" class="body">Include ESD protection, required passives and manufacturer reference circuitry in the detailed design. This drawing omits physical pin numbers.</text><text x="55" y="950" class="tiny">Phone required. No GPS or cellular in the ring. Charger is not a power-path manager; verify charge termination under connected system load.</text>
</svg>
