<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#16101E">
  <title>Live location · Security4Her</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="icon" type="image/png" href="favicon.png">
  <style>@font-face{font-family:"Instrument Sans";src:url(fonts/instrument-sans.woff2) format("woff2");font-weight:400 700;font-display:swap}</style>
  <!--
    Live location for Security4Her. The phone posts each fix to a private ntfy.sh topic (?t=...);
    this page reads the history, then follows new fixes as they arrive. No account, no key.
  -->
  <style>
    :root {
      --night: #16101E; --surface: #221A2C; --surface2: #2E2439; --line: #3D3149;
      --ink: #F3EDF7; --muted: #A99BB8; --lilac: #C49BFF; --red: #FF4D5E; --amber: #FFB547; --green: #5EE0A0;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--night); color: var(--ink);
      font: 16px/1.45 "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    #map { position: fixed; inset: 0; background: var(--night); }
    .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.82) saturate(.75); }
    .leaflet-control-attribution { background: rgba(22,16,30,.7) !important; color: var(--muted) !important; }
    .leaflet-control-attribution a { color: var(--lilac) !important; }
    .leaflet-control-zoom a { background: var(--surface) !important; color: var(--ink) !important; border-color: var(--line) !important; }

    .chip { position: fixed; top: max(14px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 500;
      display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px;
      background: rgba(34,26,44,.94); border: 1px solid var(--line); font-weight: 600; font-size: 14px; white-space: nowrap; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
    .chip.sos .dot { background: var(--red); animation: pulse 1s ease-in-out infinite alternate; }
    .chip.live .dot { background: var(--green); animation: pulse 1.2s ease-in-out infinite alternate; }
    .chip.safe .dot { background: var(--green); }
    .chip.sos { color: #FFD9DD; border-color: rgba(255,77,94,.5); }
    @keyframes pulse { from { opacity: .35 } to { opacity: 1 } }
    @media (prefers-reduced-motion: reduce) { .dot { animation: none !important; } }

    .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 500; background: var(--surface);
      border-radius: 22px 22px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
      box-shadow: 0 -8px 30px rgba(0,0,0,.35); max-width: 560px; margin: 0 auto; }
    .sheet h1 { margin: 0; font-size: 24px; line-height: 1.2; letter-spacing: -.3px; }
    .meta { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
    .meta.stale { color: var(--amber); }
    .coords { margin: 10px 0 0; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .row { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
    .btn { flex: 1 1 auto; text-align: center; text-decoration: none; font-weight: 600; font-size: 15px;
      padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); color: var(--ink); background: var(--surface2); }
    .btn.primary { background: var(--lilac); color: #1E0E33; border-color: var(--lilac); }
    .btn.red { background: var(--red); color: #fff; border-color: var(--red); }
    .btn:focus-visible { outline: 3px solid var(--lilac); outline-offset: 2px; }
    .note { margin: 12px 0 0; font-size: 12.5px; color: var(--muted); }
    .empty { position: fixed; inset: 0; z-index: 600; display: none; place-items: center; background: var(--night); padding: 24px; text-align: center; }
    .empty.show { display: grid; }
    .empty h2 { margin: 16px 0 6px; font-size: 22px; }
    .empty p { margin: 0 auto; color: var(--muted); max-width: 34ch; }

    .me { width: 22px; height: 22px; border-radius: 50%; background: var(--red); border: 3px solid #fff; box-shadow: 0 0 0 8px rgba(255,77,94,.25); }
    .me.safe { background: var(--green); box-shadow: 0 0 0 8px rgba(94,224,160,.25); }
  </style>
</head>
<body>
  <div id="map" role="application" aria-label="Map of the live location"></div>

  <div class="chip" id="chip"><span class="dot"></span><span id="chipText">Connecting…</span></div>

  <section class="sheet" id="sheet" aria-live="polite">
    <h1 id="title">Live location</h1>
    <p class="meta" id="meta">Waiting for the first location from her phone.</p>
    <p class="coords" id="coords"></p>
    <div class="row">
      <a class="btn primary" id="dir" href="#" target="_blank" rel="noopener">Directions</a>
      <a class="btn" id="gmaps" href="#" target="_blank" rel="noopener">Google Maps</a>
      <a class="btn red" id="call" href="tel:112">Call 112</a>
    </div>
    <p class="note">This page updates by itself. Keep it open. Only people with this link can see it.</p>
  </section>

  <div class="empty" id="empty">
    <div>
      <svg width="84" height="84" viewBox="0 0 108 108" aria-hidden="true">
        <circle cx="54" cy="54" r="54" fill="#C49BFF"/>
        <g transform="translate(5.4 5.6) scale(.9)">
          <path d="M27,52 Q25,31 32,21 Q34.5,19 37,21.5 L51,35 Z M81,52 Q83,31 76,21 Q73.5,19 71,21.5 L57,35 Z" fill="#FFF6EC" stroke="#2A1740" stroke-width="2.2" stroke-linejoin="round"/>
          <path d="M23,58 A31,24.5 0 1,0 85,58 A31,24.5 0 1,0 23,58 Z" fill="#FFF6EC" stroke="#2A1740" stroke-width="2.2"/>
          <ellipse cx="43.1" cy="60.5" rx="6.5" ry="7.6" fill="#2A1740"/><ellipse cx="64.9" cy="60.5" rx="6.5" ry="7.6" fill="#2A1740"/>
          <circle cx="44.7" cy="56.8" r="2.5" fill="#fff"/><circle cx="66.5" cy="56.8" r="2.5" fill="#fff"/>
          <path d="M37,78.5 Q54,87.5 71,78.5" fill="none" stroke="#FF4D5E" stroke-width="4" stroke-linecap="round"/>
        </g>
      </svg>
      <h2 id="emptyTitle">This link is missing its code</h2>
      <p id="emptyText">Open the full link from the SOS text message.</p>
    </div>
  </div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="live-message.js"></script>
  <script>
  (function () {
    var topic = new URLSearchParams(location.search).get('t') || '';
    var $ = function (id) { return document.getElementById(id); };
    if (!/^s4h-[a-z0-9]{10,40}$/.test(topic)) { $('empty').classList.add('show'); return; }

    var BASE = 'https://ntfy.sh/' + topic;
    var map = L.map('map', { zoomControl: false, attributionControl: true }).setView([21.1458, 79.0882], 13);
    L.control.zoom({ position: 'topright' }).addTo(map);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, referrerPolicy: 'strict-origin-when-cross-origin', attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    var seen = {}, points = [], name = '', mode = 'live', ended = false, lastId = null, lastAt = 0, lastAcc = null, followed = false;
    var trail = L.polyline([], { color: '#C49BFF', weight: 4, opacity: .8 }).addTo(map);
    var acc = L.circle([0, 0], { radius: 0, color: '#FF4D5E', weight: 1, fillOpacity: .12 }).addTo(map);
    var meIcon = L.divIcon({ className: '', html: '<div class="me" id="me"></div>', iconSize: [22, 22], iconAnchor: [11, 11] });
    var me = null;

    function parseName(title) {
      var m = /^SOS: (.+) may be in danger$/.exec(title) || /^(.+)'s live location$/.exec(title) ||
              /^(.+) is sharing live location$/.exec(title) || /^(.+) is safe now$/.exec(title);
      return m ? m[1] : '';
    }

    function handle(m) {
      if (!m || m.event !== 'message' || seen[m.id]) return;
      seen[m.id] = true;
      lastId = m.id;
      var tags = m.tags || [];
      if (!name) name = parseName(m.title || '');
      if (tags.indexOf('rotating_light') >= 0) mode = 'sos';
      var parsed = parseLiveMessage(m);
      if (!parsed) return;
      if (parsed.ended) ended = true;
      if (!ended && parsed.point && parsed.at > lastAt) {
        points.push(parsed.point);
        points = points.slice(-2000);
        lastAt = parsed.at;
        lastAcc = parsed.accuracy;
      }
    }

    function render() {
      var who = name || 'Her';
      $('title').textContent = ended ? 'Location sharing ended' : (mode === 'sos' ? who + ' may be in danger' : who + "'s live location");
      var chip = $('chip');
      chip.className = 'chip ' + (ended ? 'safe' : mode);
      $('chipText').textContent = ended ? 'Sharing stopped' : (mode === 'sos' ? 'SOS active' : 'Sharing live location');
      $('call').style.display = (mode === 'sos' && !ended) ? '' : 'none';
      if (!points.length) {
        $('meta').textContent = ended ? 'Sharing stopped before a location was found.' : 'Waiting for the first location from her phone.';
        $('coords').textContent = '';
        return;
      }
      var p = points[points.length - 1];
      trail.setLatLngs(points);
      acc.setLatLng(p).setRadius(lastAcc || 0);
      if (!me) me = L.marker(p, { icon: meIcon, keyboard: false }).addTo(map); else me.setLatLng(p);
      var el = document.getElementById('me');
      if (el) el.className = 'me' + (ended ? ' safe' : '');
      if (!followed) { map.setView(p, 16); followed = true; } else if (!ended) { map.panTo(p, { animate: true }); }
      var link = p[0].toFixed(6) + ',' + p[1].toFixed(6);
      $('gmaps').href = 'https://maps.google.com/?q=' + link;
      $('dir').href = 'https://www.google.com/maps/dir/?api=1&destination=' + link;
      $('coords').textContent = p[0].toFixed(5) + ', ' + p[1].toFixed(5) + (lastAcc ? ' · accurate to ' + lastAcc + ' m' : '');
      tick();
    }

    function ago(ms) {
      var s = Math.max(0, Math.round((Date.now() - ms) / 1000));
      if (s < 60) return s + ' s ago';
      var m = Math.round(s / 60);
      return m < 60 ? m + ' min ago' : Math.round(m / 60) + ' h ago';
    }

    function tick() {
      if (!points.length) return;
      var meta = $('meta');
      var stale = !ended && Date.now() - lastAt > 90000;
      meta.className = 'meta' + (stale ? ' stale' : '');
      meta.textContent = ended ? 'Last seen here ' + ago(lastAt) + '.'
        : 'Updated ' + ago(lastAt) + (stale ? '. No new update, so her phone may be offline.' : '. Updates every 20 s.');
    }
    setInterval(tick, 1000);

    function follow() {
      var es = new EventSource(BASE + '/sse?since=' + (lastId || 'all'));
      es.onopen = function () { if (!points.length && !ended) $('chipText').textContent = 'Connected · waiting'; };
      es.onmessage = function (e) { try { handle(JSON.parse(e.data)); render(); } catch (x) {} };
      es.onerror = function () {
        es.close();
        $('chipText').textContent = 'Reconnecting…';
        setTimeout(function () { follow(); render(); }, 4000);
      };
    }

    fetch(BASE + '/json?poll=1&since=all')
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(function (t) {
        t.split('\n').forEach(function (line) { if (line.trim()) { try { handle(JSON.parse(line)); } catch (x) {} } });
        if (!Object.keys(seen).length) {
          $('emptyTitle').textContent = 'Nothing shared on this link yet';
          $('emptyText').textContent = 'If you just got the text, wait a few seconds. Links stop working 12 hours after the last update.';
          $('empty').classList.add('show');
        }
        render();
        follow();
      })
      .catch(function () { $('chipText').textContent = 'No connection. Retrying…'; setTimeout(function () { location.reload(); }, 5000); });

    // Hide the "nothing yet" screen as soon as something arrives.
    setInterval(function () { if (Object.keys(seen).length) $('empty').classList.remove('show'); }, 1000);
  })();
  </script>
</body>
</html>
